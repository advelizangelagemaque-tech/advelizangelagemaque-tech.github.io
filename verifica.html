<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="r">?</pre>
<iframe id="f" src="/index.html" style="width:400px;height:600px"></iframe>
<script>
document.getElementById('f').onload=function(){
  var d=this.contentDocument, w=this.contentWindow, out=[];
  setTimeout(function(){
    var alvos=[['.cta','CTA do topo'],['.wa-float','botão verde'],['.wa-link','link do cartão']];
    alvos.forEach(function(par){
      var a=d.querySelector(par[0]); if(!a){out.push(par[1]+': nao existe');return;}
      var navegou=false;
      a.addEventListener('click',function(e){ if(!e.defaultPrevented) navegou=true; e.preventDefault(); },false);
      a.click();
      var aberto=d.querySelector('.gmq-bot').classList.contains('aberto');
      out.push(par[1]+' -> triagem abriu: '+aberto+' | tentou ir ao WhatsApp: '+navegou);
      if(aberto) d.querySelector('.gmq-bot-fechar').click();
    });
    document.getElementById('r').textContent=out.join('\n');
  },400);
};
</script></body></html>
